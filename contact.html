<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <title>Contact | Amfie Media</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo-link">
            <div class="logo">
                <span>Amfie</span>
                <img src="images/Camera.png" alt="Amfie Media Camera Icon">
                <span>Media</span>
            </div>
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="about.html">About Me</a>
        </nav>
    </header>

    <section class="contact-wrapper">
    
    <div class="contact-header">
        <div class="title-with-socials">
            <h1>Let's Connect</h1>
            <div class="contact-social-icons">
                <a href="https://www.instagram.com/filip_tetec" target="_blank"><img src="images/instagram.png" alt="Instagram" loading="lazy"></a>
                <a href="https://wa.me/385917556749" target="_blank"><img src="images/whatsapp.png" alt="WhatsApp" loading="lazy"></a>
                <a href="mailto:amfie.videos@gmail.com"><img src="images/mail.png" alt="Email" loading="lazy"></a>
                <a href="https://www.tiktok.com/@therealamfie" target="_blank"><img src="images/tiktok.png" alt="TikTok" loading="lazy"></a>
                <a href="https://www.youtube.com/@Amfiee" target="_blank"><img src="images/youtube.png" alt="YouTube" loading="lazy"></a>
            </div>
        </div>
        <p class="subtitle">Your vision deserves a dedicated approach.</p>
    </div>

    <div class="contact-layout">
        
        <div class="sidebar">
            <div class="sidebar-portrait">
                <img src="images/hero-photo.png" alt="Filip Tetec" loading="lazy">
            </div>
            <div class="sidebar-details">
                <h3>Filip Tetec</h3>
                <p>Koprivnica, Croatia</p>
                <p>amfie.videos@gmail.com</p>
            </div>
        </div>

        <div class="form-container">
            <form id="contact-form" action="https://formspree.io/f/xzdwdlra" method="POST" class="contact-form">
                <div class="form-group">
                    <input type="text" id="name" name="name" placeholder="Name" required>
                </div>
                <div class="form-group">
                    <input type="text" id="phone" name="phone" placeholder="Phone">
                </div>
                <div class="form-group">
                    <input type="email" id="email" name="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <textarea id="message" name="message" rows="8" placeholder="Tell me about your project..." required></textarea>
                </div>
                
                <button type="submit" id="submit-btn" class="btn">Send Inquiry</button>
                
                <p id="form-status" class="form-status"></p> 
            </form>
        </div>
        
    </div>
</section>

<footer class="site-footer">
    <div class="footer-content">
        <p>&copy; 2026 Amfie Media.</p>
        
        <div class="footer-icons">
            <a href="https://www.instagram.com/filip_tetec" target="_blank">
                <img src="images/instagram.png" alt="Instagram">
            </a>
            <a href="https://wa.me/385917556749" target="_blank">
                <img src="images/whatsapp.png" alt="WhatsApp">
            </a>
            <a href="mailto:amfie.videos@gmail.com">
                <img src="images/mail.png" alt="Email">
            </a>
            <a href="https://www.tiktok.com/@therealamfie" target="_blank">
                <img src="images/tiktok.png" alt="TikTok">
            </a>
            <a href="https://www.youtube.com/@Amfiee" target="_blank">
                <img src="images/youtube.png" alt="YouTube">
            </a>
        </div>
    </div>
</footer>

<script>
    var form = document.getElementById("contact-form");
    var button = document.getElementById("submit-btn");
    var status = document.getElementById("form-status");

    async function handleSubmit(event) {
        // Stop the browser from leaving the page
        event.preventDefault();
        
        // Change button text so they know it's working
        var originalButtonText = button.innerText;
        button.innerText = "Sending...";
        
        var data = new FormData(event.target);
        
        // Send the data behind the scenes
        fetch(event.target.action, {
            method: form.method,
            body: data,
            headers: {
                'Accept': 'application/json'
            }
        }).then(response => {
            if (response.ok) {
                // Success!
                status.innerHTML = "Message sent successfully. I will be in touch soon!";
                status.style.color = "#4CAF50"; // Clean green success color
                form.reset(); // Clears the form
                button.innerText = originalButtonText; // Resets button
            } else {
                // Formspree returned an error (e.g., bad email format)
                response.json().then(data => {
                    if (Object.hasOwn(data, 'errors')) {
                        status.innerHTML = data["errors"].map(error => error["message"]).join(", ");
                    } else {
                        status.innerHTML = "Oops! There was a problem submitting your form";
                    }
                    status.style.color = "#f44336"; // Error red
                    button.innerText = originalButtonText;
                })
            }
        }).catch(error => {
            status.innerHTML = "Oops! There was a problem submitting your form";
            status.style.color = "#f44336";
            button.innerText = originalButtonText;
        });
    }

    form.addEventListener("submit", handleSubmit);
</script>
</body>
</html>
