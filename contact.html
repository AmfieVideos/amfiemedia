<script src="script.js"></script>
<script>
    var form = document.getElementById("inquiry-form");
    var button = document.querySelector(".submit-btn");
    // Renamed from 'status' to 'statusMessage' to avoid the global window conflict
    var statusMessage = document.getElementById("form-status"); 

    async function handleSubmit(event) {
        // Stop the browser from leaving the page
        event.preventDefault();
        
        // Change button text so they know it's working
        var originalButtonText = button.innerText;
        button.innerText = "Sending...";
        
        var data = new FormData(event.target);
        
        try {
            // Send the data behind the scenes
            const response = await fetch(event.target.action, {
                method: form.method,
                body: data,
                headers: {
                    'Accept': 'application/json'
                }
            });

            if (response.ok) {
                // Success!
                statusMessage.innerHTML = "Message sent successfully. I will be in touch soon!";
                statusMessage.className = "form-success"; // APPLIES THE GREEN BORDER 
                form.reset(); 
                button.innerText = originalButtonText; 
            } else {
                // Formspree returned an error
                try {
                    const jsonData = await response.json();
                    if (jsonData && jsonData.errors) {
                        statusMessage.innerHTML = jsonData.errors.map(error => error.message).join(", ");
                    } else {
                        statusMessage.innerHTML = "Oops! There was a problem submitting your form.";
                    }
                } catch (parseError) {
                    statusMessage.innerHTML = "Submission blocked. Please check your Formspree settings.";
                }
                statusMessage.className = "form-error"; // APPLIES THE RED BORDER
                button.innerText = originalButtonText;
            }
        } catch (networkError) {
            statusMessage.innerHTML = "Oops! A network error occurred.";
            statusMessage.className = "form-error"; // APPLIES THE RED BORDER
            button.innerText = originalButtonText;
        }
    }

    form.addEventListener("submit", handleSubmit);
</script>
